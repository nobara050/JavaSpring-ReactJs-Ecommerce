spring.application.name=EcommerceWeb
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EcommerceWeb;encrypt=true;trustServerCertificate=true
spring.datasource.username=webAdmin
spring.datasource.password=webAdmin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

